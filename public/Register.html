<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enterprise System Registration</title><script src="https://cdn.tailwindcss.com"></script><style>body{background-color:#f3f4f6;display:flex;justify-content:center;align-items:center;height:100vh}form{background:#fff;padding:2rem;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,.1);width:300px}</style></head><body><form id="registerForm"><h2 class="text-2xl font-bold mb-4 text-center">Register</h2><input type="text" id="username" placeholder="Username" required class="w-full p-2 mb-2 border rounded"> <input type="password" id="password" placeholder="Password" required class="w-full p-2 mb-2 border rounded"> <input type="password" id="confirmPassword" placeholder="Confirm Password" required class="w-full p-2 mb-4 border rounded"> <button type="submit" class="w-full bg-green-500 text-white p-2 rounded">Register</button><p id="error" class="text-red-500 mt-2 text-center hidden"></p><p class="text-center mt-4"><a href="/Login.html" class="text-blue-500">Already have an account? Login</a></p></form><script>document.getElementById("registerForm").addEventListener("submit",async e=>{e.preventDefault();var e=document.getElementById("username").value,t=document.getElementById("password").value,n=document.getElementById("confirmPassword").value,o=document.getElementById("error");if(t!==n)o.textContent="Passwords do not match",o.classList.remove("hidden");else try{var s=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:e,password:t})}),a=await s.json();if(!s.ok)throw new Error(a.message||"Registration failed");window.location.href="/Login.html"}catch(e){o.textContent=e.message,o.classList.remove("hidden")}})</script></body></html>
