<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZKTeco API Recon Probe</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-200 p-8 font-sans">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-teal-400 mb-2">ZKTeco Reconnaissance Probe</h1>
        <p class="text-gray-400 mb-8">Bypass the DB. Dump the raw JSON. Find the data.</p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-gray-800 p-6 rounded shadow-lg border border-gray-700 col-span-1 h-fit">
                <h2 class="text-lg font-bold text-white mb-4 border-b border-gray-700 pb-2">Target Credentials</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">ZKTeco Base URL</label>
                        <input type="text" id="apiUrl" value="https://127.0.0.1:8098/api" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-white focus:outline-none focus:border-teal-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Username (Optional)</label>
                        <input type="text" id="apiUser" placeholder="admin" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Password (Optional)</label>
                        <input type="password" id="apiPass" placeholder="******" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Static Token (Fallback)</label>
                        <input type="text" id="apiToken" placeholder="Paste long token here..." class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-white focus:outline-none">
                    </div>
                    
                    <button onclick="fireProbe()" id="probeBtn" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-bold py-2 px-4 rounded shadow transition mt-4">
                        Fire Recon Probe
                    </button>
                </div>
            </div>

            <div class="bg-gray-800 p-6 rounded shadow-lg border border-gray-700 col-span-2 flex flex-col">
                <h2 class="text-lg font-bold text-white mb-4 border-b border-gray-700 pb-2">Raw JSON Payload</h2>
                <div class="flex-1 bg-gray-950 border border-gray-700 rounded p-4 overflow-auto h-[600px]">
                    <pre id="jsonOutput" class="text-xs text-green-400 font-mono whitespace-pre-wrap break-words">Awaiting probe launch...</pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fireProbe() {
            const btn = document.getElementById('probeBtn');
            const output = document.getElementById('jsonOutput');
            
            btn.innerText = "Probing...";
            btn.disabled = true;
            output.className = "text-xs text-yellow-400 font-mono whitespace-pre-wrap break-words";
            output.innerText = "Transmitting to Sync Server (Port 3050)...\nWaiting for ZKTeco response...";

            const payload = {
                apiUrl: document.getElementById('apiUrl').value,
                username: document.getElementById('apiUser').value,
                password: document.getElementById('apiPass').value,
                fallbackToken: document.getElementById('apiToken').value
            };

            try {
                // Hit our new microservice (Dynamically grab the current server's IP)
                const serverIp = window.location.hostname || '127.0.0.1';
                const res = await fetch(`http://${serverIp}:3050/api/test-zk-pull`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                
                output.className = res.ok ? "text-xs text-green-400 font-mono whitespace-pre-wrap break-words" : "text-xs text-red-400 font-mono whitespace-pre-wrap break-words";
                output.innerText = JSON.stringify(data, null, 4);

            } catch (err) {
                output.className = "text-xs text-red-500 font-mono whitespace-pre-wrap break-words";
                output.innerText = "CRITICAL ERROR: Could not reach Sync Server on port 3050.\nIs sync_server.js running?\n\nDetails: " + err.message;
            } finally {
                btn.innerText = "Fire Recon Probe";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
