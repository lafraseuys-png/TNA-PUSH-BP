<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS - TNA Africa</title>

    <!-- THEME BOOT: must stay INLINE and stay HERE (before any stylesheet) - same as Settings / Asset Tagging -->
    <script>
        (function () {
            var v = null;
            try { v = localStorage.getItem("tnaafrica_theme"); } catch (e) {}
            if (v !== "light" && v !== "dark") v = "dark";
            window.__TNA_THEME = v;
            document.documentElement.classList.remove("dark-mode", "light-mode");
            document.documentElement.classList.add(v === "dark" ? "dark-mode" : "light-mode");
            document.documentElement.setAttribute("data-theme", v);
        })();
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ------------------------------------------------------------------
           THEME TOKENS (dark is the system default)
           ------------------------------------------------------------------ */
        body {
            --bg: #0b1220; --bg2: #111a2e;
            --panel: rgba(30, 41, 59, 0.72); --panel-solid: #1e293b; --panel-2: rgba(15, 23, 42, 0.55);
            --border: rgba(255, 255, 255, 0.09); --border-strong: rgba(255, 255, 255, 0.18);
            --text: #e2e8f0; --text-strong: #f8fafc; --muted: #94a3b8; --faint: #64748b;
            --accent: #3b82f6; --accent-soft: rgba(59, 130, 246, 0.16); --accent-text: #93c5fd;
            --good: #22c55e; --good-soft: rgba(34, 197, 94, 0.15);
            --bad: #ef4444; --bad-soft: rgba(239, 68, 68, 0.15);
            --warn: #f59e0b; --warn-soft: rgba(245, 158, 11, 0.15);
            --tile: #1e293b; --tile-hover: #273449;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            --overlay: rgba(2, 6, 23, 0.72);
        }
        body.light-mode {
            --bg: #e9eef5; --bg2: #dde5ef;
            --panel: rgba(255, 255, 255, 0.82); --panel-solid: #ffffff; --panel-2: rgba(241, 245, 249, 0.9);
            --border: rgba(15, 23, 42, 0.10); --border-strong: rgba(15, 23, 42, 0.22);
            --text: #334155; --text-strong: #0f172a; --muted: #64748b; --faint: #94a3b8;
            --accent: #1a4c7b; --accent-soft: rgba(26, 76, 123, 0.10); --accent-text: #1a4c7b;
            --good: #15803d; --good-soft: rgba(22, 163, 74, 0.12);
            --bad: #b91c1c; --bad-soft: rgba(220, 38, 38, 0.10);
            --warn: #b45309; --warn-soft: rgba(217, 119, 6, 0.12);
            --tile: #ffffff; --tile-hover: #f1f5f9;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.10);
            --overlay: rgba(15, 23, 42, 0.45);
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(1200px 600px at 10% -10%, var(--bg2), var(--bg));
            color: var(--text); overflow: hidden; -webkit-tap-highlight-color: transparent;
        }
        button { font-family: inherit; }
        input, select, textarea { font-family: inherit; }
        .hidden { display: none !important; }

        /* ------------------------------------------------------------------
           LAYOUT
           ------------------------------------------------------------------ */
        #app { display: flex; flex-direction: column; height: 100vh; }

        .topbar {
            display: flex; align-items: center; gap: 10px; padding: 10px 14px;
            background: var(--panel); border-bottom: 1px solid var(--border);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        }
        .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .brand i { font-size: 22px; color: var(--accent-text); }
        .brand-logo { height: 38px; width: auto; max-width: 130px; object-fit: contain; border-radius: 8px; background: #fff; padding: 2px 6px; }
        .brand h1 { margin: 0; font-size: 17px; font-weight: 900; letter-spacing: 1.5px; color: var(--text-strong); }
        .brand small { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
        .day-chip { font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel-2); color: var(--muted); white-space: nowrap; }
        .day-chip b { color: var(--text-strong); }
        .day-chip.open { border-color: rgba(34, 197, 94, 0.4); }
        .day-chip.closed { border-color: rgba(239, 68, 68, 0.4); color: var(--bad); }
        .day-chip.old { border-color: rgba(245, 158, 11, 0.5); color: var(--warn); }
        .spacer { flex: 1; }
        .top-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-strong);
            background: var(--panel-solid); color: var(--text-strong); font-weight: 700; font-size: 13px;
            cursor: pointer; transition: transform 0.08s ease, background 0.2s ease; user-select: none; white-space: nowrap;
        }
        .btn:hover { background: var(--tile-hover); }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
        .btn i { color: var(--accent-text); }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-primary i, .btn-good i, .btn-bad i { color: #fff; }
        .btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
        .btn-good { background: #16a34a; border-color: #16a34a; color: #fff; }
        .btn-good:hover { filter: brightness(1.08); background: #16a34a; }
        .btn-bad { background: var(--bad-soft); border-color: rgba(239, 68, 68, 0.45); color: var(--bad); }
        .btn-bad i { color: var(--bad); }
        .btn-ghost { background: transparent; }
        .btn-lg { padding: 16px 18px; font-size: 16px; border-radius: 12px; }
        .btn-xl { padding: 20px; font-size: 20px; border-radius: 14px; }
        .btn-icon { width: 42px; padding: 10px 0; }

        .pos-main { flex: 1; display: grid; grid-template-columns: 1fr 380px; min-height: 0; }

        /* Catalogue */
        .catalog { display: flex; flex-direction: column; min-height: 0; padding: 12px; gap: 10px; }
        .searchbar { display: flex; gap: 8px; }
        .searchbar .field { flex: 1; position: relative; }
        .searchbar .field i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
        .input {
            width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-strong);
            background: var(--panel-solid); color: var(--text-strong); font-size: 15px; outline: none;
        }
        .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .searchbar .input { padding-left: 40px; font-size: 16px; }
        select.input { appearance: auto; }
        body.dark-mode { color-scheme: dark; }
        body.light-mode { color-scheme: light; }

        .crumbs { display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 14px; color: var(--muted); }
        .crumbs b { color: var(--text-strong); }

        .grid-wrap { flex: 1; overflow-y: auto; padding-right: 4px; }
        .cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

        .tile {
            position: relative; border: 1px solid var(--border); border-radius: 14px; background: var(--tile);
            cursor: pointer; overflow: hidden; box-shadow: var(--shadow); user-select: none;
            transition: transform 0.08s ease, background 0.2s ease;
        }
        .tile:active { transform: scale(0.97); }
        .tile:hover { background: var(--tile-hover); }
        .cat-tile { height: 120px; display: flex; align-items: flex-end; padding: 14px; color: #fff; border: none; }
        .cat-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.55; }
        .cat-tile .cat-name { position: relative; font-size: 22px; font-weight: 900; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); }
        .cat-tile .cat-count { position: absolute; top: 10px; right: 12px; font-size: 12px; font-weight: 800; background: rgba(0, 0, 0, 0.35); padding: 3px 8px; border-radius: 999px; }

        .item-tile { display: flex; flex-direction: column; min-height: 150px; }
        .item-tile .img { height: 86px; background: var(--panel-2); display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 26px; overflow: hidden; }
        .item-tile .img img { width: 100%; height: 100%; object-fit: cover; }
        .item-tile .body { padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .item-tile .name { font-size: 13px; font-weight: 700; color: var(--text-strong); line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .item-tile .price { font-size: 16px; font-weight: 900; color: var(--accent-text); margin-top: auto; }
        .badge { display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
        .badge-stock { position: absolute; top: 6px; right: 6px; background: rgba(15, 23, 42, 0.75); color: #fff; }
        .badge-stock.low { background: rgba(220, 38, 38, 0.85); }
        .badge-vat { background: var(--warn-soft); color: var(--warn); border: 1px solid rgba(245, 158, 11, 0.4); }
        .badge-good { background: var(--good-soft); color: var(--good); border: 1px solid rgba(34, 197, 94, 0.35); }
        .badge-bad { background: var(--bad-soft); color: var(--bad); border: 1px solid rgba(239, 68, 68, 0.35); }
        .badge-info { background: var(--accent-soft); color: var(--accent-text); border: 1px solid var(--border-strong); }

        /* Basket */
        .basket { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--border); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
        .basket-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); }
        .basket-head h2 { margin: 0; font-size: 15px; font-weight: 900; color: var(--text-strong); text-transform: uppercase; letter-spacing: 1px; }
        .basket-lines { flex: 1; overflow-y: auto; padding: 6px 10px; }
        .basket-empty { text-align: center; color: var(--faint); padding: 40px 10px; font-size: 14px; }
        .basket-empty i { font-size: 40px; display: block; margin-bottom: 10px; }
        .bline { display: grid; grid-template-columns: 1fr auto; gap: 6px; padding: 10px 6px; border-bottom: 1px dashed var(--border); }
        .bline .bname { font-weight: 700; color: var(--text-strong); font-size: 14px; }
        .bline .bsub { font-size: 12px; color: var(--muted); }
        .bline .btotal { font-weight: 900; color: var(--text-strong); text-align: right; font-size: 15px; }
        .bline .bctl { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; }
        .qty-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--panel-solid); color: var(--text-strong); font-size: 16px; font-weight: 900; cursor: pointer; }
        .qty-val { min-width: 44px; text-align: center; font-weight: 900; font-size: 16px; color: var(--text-strong); }
        .remove-btn { margin-left: auto; border: 1px solid rgba(239, 68, 68, 0.45); background: var(--bad-soft); color: var(--bad); border-radius: 10px; height: 38px; padding: 0 12px; font-weight: 800; cursor: pointer; }
        .bline.flash { animation: flash 0.5s ease; }
        @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }

        .totals { padding: 12px 14px; border-top: 1px solid var(--border); background: var(--panel-2); }
        .trow { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 2px 0; }
        .trow.total { font-size: 26px; font-weight: 900; color: var(--text-strong); padding-top: 6px; }
        .basket-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; padding: 12px 14px; }

        /* Overlay when trading is blocked */
        .blocker { position: absolute; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; z-index: 30; backdrop-filter: blur(3px); }
        .blocker .card { background: var(--panel-solid); border: 1px solid var(--border); border-radius: 18px; padding: 28px; max-width: 460px; width: 92%; text-align: center; box-shadow: var(--shadow); }
        .blocker h3 { margin: 0 0 8px; color: var(--text-strong); font-size: 22px; }
        .blocker p { color: var(--muted); margin: 0 0 18px; }

        /* ------------------------------------------------------------------
           MODALS
           ------------------------------------------------------------------ */
        .modal-back { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 12px; backdrop-filter: blur(4px); animation: fade 0.15s ease; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            background: var(--panel-solid); color: var(--text); border: 1px solid var(--border); border-radius: 18px;
            width: 100%; max-width: 560px; max-height: 94vh; display: flex; flex-direction: column; box-shadow: var(--shadow);
            animation: pop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes pop { from { transform: scale(0.97) translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
        .modal.lg { max-width: 820px; }
        .modal.xl { max-width: 1100px; }
        .modal.sm { max-width: 400px; }
        .modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
        .modal-head h3 { margin: 0; font-size: 18px; color: var(--text-strong); flex: 1; }
        .modal-head .x { border: none; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; }
        .modal-body { padding: 16px 18px; overflow-y: auto; flex: 1; }
        .modal-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--border); background: var(--panel-2); border-radius: 0 0 18px 18px; }
        .modal-foot .left { margin-right: auto; }

        .label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin: 10px 0 5px; }
        .note { font-size: 12px; color: var(--muted); }
        .err { background: var(--bad-soft); color: var(--bad); border: 1px solid rgba(239, 68, 68, 0.4); padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-top: 10px; }
        .warnbox { background: var(--warn-soft); color: var(--warn); border: 1px solid rgba(245, 158, 11, 0.45); padding: 10px 12px; border-radius: 10px; font-size: 13px; }
        .okbox { background: var(--good-soft); color: var(--good); border: 1px solid rgba(34, 197, 94, 0.4); padding: 10px 12px; border-radius: 10px; font-size: 13px; }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .big-total { text-align: center; padding: 10px 0 4px; }
        .big-total .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
        .big-total .amt { font-size: 40px; font-weight: 900; color: var(--text-strong); }

        .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
        .seg .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .seg .btn.active i { color: #fff; }

        .list { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .list-row { display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
        .list-row:last-child { border-bottom: none; }
        .list-row:hover { background: var(--tile-hover); }
        .list-row.selected { background: var(--accent-soft); }
        .list-row .main { flex: 1; min-width: 0; }
        .list-row .t1 { font-weight: 700; color: var(--text-strong); }
        .list-row .t2 { font-size: 12px; color: var(--muted); }
        .list-row .amt { font-weight: 900; color: var(--text-strong); white-space: nowrap; }

        table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
        table.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel-solid); }
        table.tbl td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        table.tbl .r { text-align: right; }
        table.tbl .c { text-align: center; }
        .cnt-input { width: 90px; text-align: center; font-size: 16px; font-weight: 800; padding: 8px; }

        /* Notes & coins counter */
        .denoms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .denom { display: grid; grid-template-columns: 70px 36px 1fr 36px; align-items: center; gap: 6px; padding: 6px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2); }
        .denom .val { font-weight: 900; color: var(--text-strong); font-size: 15px; }
        .denom input { text-align: center; padding: 8px 4px; font-size: 16px; font-weight: 800; }
        .denom .amt { grid-column: 1 / -1; text-align: right; font-size: 12px; color: var(--muted); }
        .denom-total { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--accent-soft); font-size: 22px; font-weight: 900; color: var(--text-strong); }

        /* PIN pad */
        .pin-dots { display: flex; justify-content: center; gap: 12px; margin: 10px 0 16px; }
        .pin-dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border-strong); }
        .pin-dots span.on { background: var(--accent); border-color: var(--accent); }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .keypad button { height: 64px; font-size: 24px; font-weight: 900; border-radius: 14px; border: 1px solid var(--border-strong); background: var(--panel-2); color: var(--text-strong); cursor: pointer; }
        .keypad button:active { transform: scale(0.96); }

        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-size: 14px; }
        .summary-grid .k { color: var(--muted); }
        .summary-grid .v { text-align: right; font-weight: 800; color: var(--text-strong); }
        .summary-grid .sep { grid-column: 1 / -1; border-top: 1px dashed var(--border); margin: 4px 0; }

        .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
        .tabs button { border: none; background: transparent; color: var(--muted); padding: 10px 14px; font-weight: 800; font-size: 14px; cursor: pointer; border-bottom: 3px solid transparent; }
        .tabs button.active { color: var(--accent-text); border-bottom-color: var(--accent); }

        #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
        .toast { pointer-events: auto; background: var(--panel-solid); color: var(--text-strong); border: 1px solid var(--border-strong); padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow); font-weight: 700; font-size: 14px; max-width: 90vw; animation: pop 0.2s ease; }
        .toast.good { border-color: rgba(34, 197, 94, 0.5); }
        .toast.bad { border-color: rgba(239, 68, 68, 0.55); color: var(--bad); }

        .fatal { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

        /* ------------------------------------------------------------------
           TABLET / PHONE
           ------------------------------------------------------------------ */
        @media (max-width: 1100px) {
            .pos-main { grid-template-columns: 1fr 330px; }
            .top-actions .btn span { display: none; }
            .top-actions .btn { padding: 10px 12px; }
        }
        @media (max-width: 760px) {
            body { overflow: auto; }
            #app { height: auto; min-height: 100vh; }
            .pos-main { grid-template-columns: 1fr; }
            .grid-wrap { max-height: 55vh; }
            .basket { border-left: none; border-top: 1px solid var(--border); }
            .basket-lines { max-height: 40vh; }
            .denoms { grid-template-columns: 1fr; }
            .day-chip { display: none; }
            .brand small { display: none; }
            .item-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        }
    </style>
</head>
<body>
    <script>
        // THEME SYNC: applies the <head> boot decision to <body> before anything paints
        (function () {
            var t = window.__TNA_THEME || "dark";
            document.body.classList.remove("dark-mode", "light-mode");
            document.body.classList.add(t === "dark" ? "dark-mode" : "light-mode");
        })();
    </script>

    <div id="app" class="hidden">
        <header class="topbar">
            <div class="brand">
                <img id="posTenantLogo" class="brand-logo hidden" alt="">
                <i class="fas fa-cash-register" id="posBrandIcon"></i>
                <div><h1>POS</h1><small id="posCashier">-</small></div>
            </div>
            <div class="day-chip" id="dayChip">Loading...</div>
            <div class="spacer"></div>
            <div class="top-actions" id="topActions">
                <button class="btn hidden" id="btnStartDay"><i class="fas fa-sun"></i><span>Start Day</span></button>
                <button class="btn" id="btnStockTake"><i class="fas fa-clipboard-list"></i><span>Stock Take</span></button>
                <button class="btn hidden" id="btnCashOut"><i class="fas fa-money-bill-transfer"></i><span>Cash Out</span></button>
                <button class="btn hidden" id="btnReturns"><i class="fas fa-rotate-left"></i><span>Returns</span></button>
                <button class="btn" id="btnMySales"><i class="fas fa-receipt"></i><span>My Sales</span></button>
                <button class="btn hidden" id="btnEndDay"><i class="fas fa-moon"></i><span>Cash-Up</span></button>
                <button class="btn hidden" id="btnInstallApp" title="Download the installed (offline) till"><i class="fas fa-download"></i><span>Install App</span></button>
                <button class="btn btn-icon" id="btnTheme" title="Light / dark"><i class="fas fa-circle-half-stroke"></i></button>
                <button class="btn btn-icon" id="btnExit" title="Exit"><i class="fas fa-right-from-bracket"></i></button>
            </div>
        </header>

        <main class="pos-main" style="position:relative;">
            <section class="catalog">
                <div class="searchbar">
                    <div class="field">
                        <i class="fas fa-barcode"></i>
                        <input class="input" id="searchInput" placeholder="Scan barcode or search items..." autocomplete="off">
                    </div>
                    <button class="btn" id="btnClearSearch" title="Clear search"><i class="fas fa-xmark"></i></button>
                </div>
                <div class="crumbs" id="crumbs"></div>
                <div class="grid-wrap" id="gridWrap"></div>
            </section>

            <aside class="basket">
                <div class="basket-head">
                    <h2><i class="fas fa-basket-shopping"></i> Sale</h2>
                    <span class="note" id="basketCount">0 items</span>
                </div>
                <div class="basket-lines" id="basketLines"></div>
                <div class="totals">
                    <div class="trow" id="rowExVat"><span>Excl VAT</span><span id="tExVat">0.00</span></div>
                    <div class="trow" id="rowVat"><span id="tVatLbl">VAT</span><span id="tVat">0.00</span></div>
                    <div class="trow total"><span>Total</span><span id="tTotal">0.00</span></div>
                </div>
                <div class="basket-actions">
                    <button class="btn btn-bad btn-lg" id="btnClearBasket"><i class="fas fa-trash"></i> Clear</button>
                    <button class="btn btn-good btn-lg" id="btnPay"><i class="fas fa-money-bill-wave"></i> Pay</button>
                </div>
            </aside>

            <div class="blocker hidden" id="blocker">
                <div class="card">
                    <h3 id="blockerTitle">Start the day</h3>
                    <p id="blockerText">Count the opening float before making sales.</p>
                    <button class="btn btn-primary btn-lg" id="blockerBtn"><i class="fas fa-sun"></i> Start Day</button>
                </div>
            </div>
        </main>
    </div>

    <div id="fatal" class="fatal hidden"></div>
    <div id="modalRoot"></div>
    <div id="toast"></div>

    <script src="POSSlips.js?v=1.0.0"></script>
    <script src="theme.js?v=1.0.0"></script>
    <script src="pos.js?v=1.0.0"></script>
</body>
</html>
