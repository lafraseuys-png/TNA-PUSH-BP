<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>TNA Africa - Hardware Godmode</title><script src="/socket.io/socket.io.js"></script><style>:root{--bg-dark:#0e1013;--card-bg:#1c1f26;--border-color:#30363d;--text-main:#adbac7;--accent-green:#2ea043;--accent-blue:#58a6ff;--accent-yellow:#d29922}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg-dark);color:var(--text-main);padding:20px;height:95vh;display:flex;flex-direction:column;margin:0}h2{color:#fff;margin-bottom:20px}.tabs{display:flex;gap:5px;margin-bottom:0;border-bottom:1px solid var(--border-color)}.tab-btn{background:var(--card-bg);color:#8b949e;border:1px solid var(--border-color);border-bottom:none;padding:12px 25px;cursor:pointer;border-radius:6px 6px 0 0;font-weight:600;transition:.2s}.tab-btn:hover{background:#24292f}.tab-btn.active{background:var(--bg-dark);color:#fff;border-top:3px solid var(--accent-green);padding-top:9px}.tab-content{display:none;flex:1;background:var(--bg-dark);border:1px solid var(--border-color);border-top:none;padding:15px;overflow:hidden}.tab-content.active{display:flex;flex-direction:column}.window-container{background:#000;border-radius:8px;flex:1;overflow-y:auto;padding:15px;font-family:Consolas,'Courier New',monospace;font-size:.9em;line-height:1.6;border:1px solid #333}.log-entry{margin-bottom:5px;border-bottom:1px solid #1a1a1a;padding-bottom:2px}.type-SEND{color:var(--accent-blue)}.type-RECEIVE{color:var(--accent-yellow)}.type-PING{color:#8b949e}.type-SYSTEM{color:var(--accent-green)}table{width:100%;border-collapse:collapse;color:var(--text-main)}th{text-align:left;background:#24292f;padding:12px;position:sticky;top:0}td{padding:12px;border-bottom:1px solid var(--border-color)}.save-btn{background:var(--accent-blue);color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:.8em;margin-left:10px}.save-btn:hover{opacity:.8}</style></head><body><h2>TNA Africa - Hardware Engine Control</h2><div class="tabs"><button class="tab-btn active" onclick='openTab(event,"system-logs")'>Handshake & Logs</button> <button class="tab-btn" onclick='openTab(event,"live-traffic")'>Live Attendance</button> <button class="tab-btn" onclick='openTab(event,"registered-devices")'>Saved Hardware</button></div><div id="system-logs" class="tab-content active"><div class="window-container" id="log-content"><div class="log-entry" style="color:var(--accent-green)">> TNA Engine Initialized. Watching Port 8091...</div></div></div><div id="live-traffic" class="tab-content"><div class="window-container"><table><thead><tr><th>Serial Number</th><th>User PIN</th><th>Timestamp</th><th>Action</th></tr></thead><tbody id="traffic-body"></tbody></table></div></div><div id="registered-devices" class="tab-content"><div class="window-container"><table><thead><tr><th>Device Name</th><th>Serial Number</th><th>Last Seen</th><th>Status</th></tr></thead><tbody id="devices-body"></tbody></table></div></div><script>let socket=io();async function loadSavedDevices(){try{var e=await fetch("/api/devices");if(!e.ok)throw new Error("Failed to fetch devices");var t=await e.json();let a=document.getElementById("devices-body");a.innerHTML="",t.forEach(e=>{var t=a.insertRow(),n=e.last_seen?new Date(e.last_seen).toLocaleString():"Never";t.innerHTML=`
                        <td>${e.device_name||"Unnamed Device"}</td>
                        <td>${e.serial_number}</td>
                        <td>${n}</td>
                        <td><span style="color:${"Online"===e.status?"#2ea043":"#8b949e"}">● ${e.status}</span></td>
                    `})}catch(e){console.error("API Error:",e)}}function openTab(e,t){var n=document.getElementsByClassName("tab-content");for(let e=0;e<n.length;e++)n[e].classList.remove("active");var a=document.getElementsByClassName("tab-btn");for(let e=0;e<a.length;e++)a[e].classList.remove("active");document.getElementById(t).classList.add("active"),e.currentTarget.classList.add("active"),"registered-devices"===t&&loadSavedDevices()}function promptRegistration(e){var t=prompt(`Enter a descriptive name for device ${e}:`,"Front Office Gate");t&&(socket.emit("register_device",{sn:e,name:t,ip:"detected"}),alert('Device save request sent to SQL. Switch to "Saved Hardware" tab to view.'))}socket.on("status_log",e=>{var t=document.getElementById("log-content"),n=document.createElement("div");n.className="log-entry";let a="";"RECEIVE"===e.type&&e.message.includes("Handshake")&&(a=`<button class="save-btn" onclick="promptRegistration('${e.sn}')">Save Device</button>`),n.innerHTML=`
                <span style="color:#8b949e">[${e.time}]</span> 
                <span class="type-${e.type}">[${e.type}]</span> 
                <span style="color:white">${e.sn}</span>: 
                ${e.message} ${a}
            `,t.appendChild(n),t.scrollTop=t.scrollHeight}),socket.on("punch",e=>{var t=document.getElementById("traffic-body");t.insertRow(0).innerHTML=`
                <td>${e.sn}</td>
                <td><strong>${e.pin}</strong></td>
                <td>${e.time}</td>
                <td style="color:${"Check-In"===e.type?"#2ea043":"#f85149"}">${e.type}</td>
            `,50<t.rows.length&&t.deleteRow(50)}),window.onload=loadSavedDevices</script></body></html>
